plugins { id 'com.android.application' }

android {
    namespace 'id.khasku'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding = 'UTF-8'
    }

    defaultConfig {
        applicationId 'id.khasku'
        minSdk 34
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}
